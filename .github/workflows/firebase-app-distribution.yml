name: Android CI and Firebase App Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Signing type used by the app already installed on your phone
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

concurrency:
  group: pharmacy-app-distribution
  cancel-in-progress: false

jobs:
  build-and-distribute:
    name: Build and distribute Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || vars.ANDROID_BUILD_TYPE || '' }}
      FIREBASE_TESTERS: ${{ vars.FIREBASE_TESTERS }}
      FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
      FIREBASE_APP_DISTRIBUTION_ENABLED: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Validate Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ANDROID_BUILD_TYPE" != "debug" && "$ANDROID_BUILD_TYPE" != "release" ]]; then
            echo "::error::ANDROID_BUILD_TYPE must be debug or release."
            exit 1
          fi

          if [[ -z "$FIREBASE_TESTERS" && -z "$FIREBASE_GROUPS" ]]; then
            echo "::error::Set the FIREBASE_TESTERS or FIREBASE_GROUPS repository variable so Firebase knows who should receive each build."
            exit 1
          fi

          if [[ ! -f app/google-services.json ]]; then
            if [[ -z "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
              echo "::error::Add GOOGLE_SERVICES_JSON_BASE64 to GitHub Actions secrets, or provide app/google-services.json."
              exit 1
            fi
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

          jq empty app/google-services.json
          expected_package='com.aistudio.arabicpharmacy.qrxmzk'
          firebase_app_id="$(jq -r --arg package "$expected_package" '.client[]? | select(.client_info.android_client_info.package_name == $package) | .client_info.mobilesdk_app_id' app/google-services.json | head -n 1)"

          if [[ -z "$firebase_app_id" || "$firebase_app_id" == "null" ]]; then
            echo "::error::google-services.json does not contain the Android app package $expected_package. Download the config for the exact same Firebase Android app."
            exit 1
          fi

          echo "FIREBASE_APP_ID=$firebase_app_id" >> "$GITHUB_ENV"
          echo "Firebase Android app configuration validated."

      - name: Prepare the matching Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ANDROID_BUILD_TYPE" == "debug" ]]; then
            if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
              echo "::error::For debug builds, add the exact debug.keystore that signed the APK on your phone as ANDROID_DEBUG_KEYSTORE_BASE64."
              exit 1
            fi
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> "$GITHUB_ENV"
          else
            if [[ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]]; then
              echo "::error::For release builds, add the existing my-upload-key.jks as ANDROID_RELEASE_KEYSTORE_BASE64."
              exit 1
            fi
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
          fi

      - name: Run JVM unit tests
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ANDROID_BUILD_TYPE" == "debug" ]]; then
            gradle :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testReleaseUnitTest --no-daemon
          fi

      - name: Build signed APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ANDROID_BUILD_TYPE" == "debug" ]]; then
            gradle :app:assembleDebug --no-daemon
            apk_path="app/build/outputs/apk/debug/app-debug.apk"
          else
            if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
              echo "::error::Release builds require STORE_PASSWORD and KEY_PASSWORD GitHub secrets."
              exit 1
            fi
            gradle :app:assembleRelease --no-daemon
            apk_path="app/build/outputs/apk/release/app-release.apk"
          fi

          test -s "$apk_path"
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"
          echo "Built $apk_path"

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: saydaliyati-${{ env.ANDROID_BUILD_TYPE }}-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Distribute to Firebase App Distribution
        shell: bash
        run: |
          set -euo pipefail
          commit_subject="$(git log -1 --pretty=%s)"
          release_notes="$commit_subject (commit ${GITHUB_SHA:0:7}, build #$GITHUB_RUN_NUMBER)"
          args=(
            "$APK_PATH"
            --app "$FIREBASE_APP_ID"
            --release-notes "$release_notes"
          )

          if [[ -n "$FIREBASE_TESTERS" ]]; then
            args+=(--testers "$FIREBASE_TESTERS")
          fi
          if [[ -n "$FIREBASE_GROUPS" ]]; then
            args+=(--groups "$FIREBASE_GROUPS")
          fi

          firebase appdistribution:distribute "${args[@]}"
